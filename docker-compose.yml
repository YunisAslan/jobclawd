services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobclawd"]
      interval: 5s
      timeout: 5s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    ports:
      - "8191:8191"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobclawd}:${POSTGRES_PASSWORD:-jobclawd}@postgres:5432/${POSTGRES_DB:-jobclawd}
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    volumes:
      - ./apps/api:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - API_INTERNAL_URL=http://api:8000
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    depends_on:
      - api
    command: npm run dev:docker

volumes:
  postgres_data:
