services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobclawd"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobclawd}:${POSTGRES_PASSWORD:-jobclawd}@postgres:5432/${POSTGRES_DB:-jobclawd}
    volumes:
      - ./apps/api:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - ./packages/shared:/packages/shared
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev:docker

volumes:
  postgres_data:
